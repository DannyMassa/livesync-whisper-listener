{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "livesync-whisper-listener.fullname" . }}
  labels:
    {{- include "livesync-whisper-listener.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "livesync-whisper-listener.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- with .Values.networkPolicy.egressPeers }}
    - to:
        {{- toYaml . | nindent 8 }}
    {{- end }}
{{- end }}
